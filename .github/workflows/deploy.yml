name: Deploy to GitHub Pages

# Every push to main rebuilds and publishes. `workflow_dispatch` lets you
# re-run it by hand from the Actions tab without making a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The minimum GitHub Pages needs: read the repo, write a Pages deployment, and
# mint an OIDC token to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a run that is already
# publishing is allowed to finish rather than leaving the site half-swapped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs, runs `astro build`, and uploads dist/ as the Pages artifact.
      #
      # Node 22 because Astro 7 requires >=22.12.
      #
      # The pnpm version is deliberately NOT pinned here — it comes from the
      # `packageManager` field in package.json, so CI and a laptop can't drift.
      # This used to say `pnpm@latest`, which resolved to pnpm 11 and failed:
      # pnpm 11 enforces a minimum-release-age supply-chain policy and rejected
      # a transitive dependency that had been published hours earlier. The
      # lockfile was fine; the package manager reading it was not the one that
      # wrote it.
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
